<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hockey Movement Analyzer — Set New Password</title>
<style>
  :root {
    --ice: #e8f4fd;
    --rink: #0a1628;
    --gold: #00c8ff;
    --green: #27ae60;
    --red: #e74c3c;
    --muted: #8899aa;
    --card: #111e2e;
    --border: #1e3048;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--rink);
    color: var(--ice);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(30,80,120,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(30,80,120,0.08) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }
  header {
    background: linear-gradient(135deg, #060f1c 0%, #082030 100%);
    border-bottom: 2px solid var(--gold);
    padding: 0.6rem 2rem 0.8rem;
    display: flex;
    align-items: center;
    gap: 1.2rem;
    position: relative;
    z-index: 1;
  }
  header h1 { font-size: 1.6rem; font-weight: 700; color: #fff; }
  header p  { color: var(--muted); font-size: 0.85rem; margin-top: 0.1rem; }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4rem 2rem;
    position: relative;
    z-index: 1;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2.5rem;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.5);
  }
  .card-icon {
    font-size: 2.2rem;
    text-align: center;
    margin-bottom: 1rem;
  }
  .card h3 {
    font-size: 1.25rem;
    font-weight: 700;
    margin-bottom: 0.3rem;
    text-align: center;
  }
  .card .sub {
    font-size: 0.83rem;
    color: var(--muted);
    margin-bottom: 2rem;
    text-align: center;
    line-height: 1.5;
  }
  .email-badge {
    display: inline-block;
    background: rgba(0,200,255,0.08);
    border: 1px solid rgba(0,200,255,0.2);
    border-radius: 6px;
    padding: 0.2rem 0.6rem;
    font-size: 0.82rem;
    color: var(--gold);
    font-weight: 600;
    margin-top: 0.3rem;
  }

  label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 0.4rem;
  }
  .input-wrap {
    position: relative;
    margin-bottom: 1.2rem;
  }
  input[type="password"],
  input[type="text"] {
    width: 100%;
    background: #0d1a2a;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.75rem 2.8rem 0.75rem 1rem;
    font-size: 0.95rem;
    color: var(--ice);
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="password"]:focus,
  input[type="text"]:focus { border-color: var(--gold); }
  input::placeholder { color: #3a5070; }

  .toggle-vis {
    position: absolute;
    right: 0.85rem;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 1rem;
    padding: 0;
    line-height: 1;
  }
  .toggle-vis:hover { color: var(--gold); }

  .strength-bar {
    height: 4px;
    border-radius: 2px;
    background: var(--border);
    margin-top: -0.85rem;
    margin-bottom: 1.2rem;
    overflow: hidden;
  }
  .strength-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.3s, background 0.3s;
    width: 0%;
    background: var(--red);
  }

  .btn {
    width: 100%;
    background: var(--gold);
    color: #0a1628;
    border: none;
    border-radius: 10px;
    padding: 0.85rem;
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: 0.03em;
    transition: background 0.2s, transform 0.1s;
  }
  .btn:hover  { background: #33d4ff; }
  .btn:active { transform: scale(0.98); }

  .error-box {
    background: rgba(231,76,60,0.1);
    border: 1px solid rgba(231,76,60,0.35);
    border-radius: 8px;
    padding: 0.7rem 1rem;
    font-size: 0.85rem;
    color: #ff7a6e;
    margin-bottom: 1.2rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 1.8rem 0;
  }
  .back-link {
    display: block;
    text-align: center;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .back-link a {
    color: var(--gold);
    font-weight: 600;
    text-decoration: none;
  }
  footer {
    text-align: center;
    padding: 1.5rem;
    font-size: 0.78rem;
    color: #2a4060;
    position: relative;
    z-index: 1;
  }
</style>
</head>
<body>

<header>
  <img src="/static/img/vikings-logo.png" alt="Vikings logo"
       style="height:52px;width:auto;filter:drop-shadow(0 0 8px rgba(0,200,255,0.5));flex-shrink:0;">
  <div>
    <h1>Hockey Movement Analyzer</h1>
    <p>AI-powered biomechanical analysis for hockey players</p>
  </div>
</header>

<main>
  <div class="card">
    <div class="card-icon">🔒</div>
    <h3>Set New Password</h3>
    <p class="sub">
      Choose a new password for<br>
      <span class="email-badge">{{ email }}</span>
    </p>

    {% if error %}
    <div class="error-box"><span>&#9888;</span> {{ error }}</div>
    {% endif %}

    <form method="POST">
      <label for="password">New Password</label>
      <div class="input-wrap">
        <input type="password" id="password" name="password"
               placeholder="At least 6 characters" autocomplete="new-password" required
               oninput="updateStrength(this.value)"/>
        <button type="button" class="toggle-vis" onclick="toggleVis('password', this)"
                title="Show/hide password">&#128065;</button>
      </div>
      <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>

      <label for="confirm">Confirm Password</label>
      <div class="input-wrap">
        <input type="password" id="confirm" name="confirm"
               placeholder="Repeat new password" autocomplete="new-password" required/>
        <button type="button" class="toggle-vis" onclick="toggleVis('confirm', this)"
                title="Show/hide password">&#128065;</button>
      </div>

      <button type="submit" class="btn">Update Password &rarr;</button>
    </form>

    <div class="divider"></div>
    <p class="back-link"><a href="/login">&larr; Back to Sign In</a></p>
  </div>
</main>

<footer>Hockey Movement Analyzer &mdash; All video processing happens locally on your machine.</footer>

<script>
function toggleVis(id, btn) {
  const inp = document.getElementById(id);
  if (inp.type === "password") {
    inp.type = "text";
    btn.style.color = "var(--gold)";
  } else {
    inp.type = "password";
    btn.style.color = "";
  }
}

function updateStrength(val) {
  const fill = document.getElementById("strengthFill");
  let score = 0;
  if (val.length >= 6)  score++;
  if (val.length >= 10) score++;
  if (/[A-Z]/.test(val)) score++;
  if (/[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;

  const pct   = Math.min(100, score * 20);
  const color = score <= 1 ? "#e74c3c" : score <= 2 ? "#e67e22" : score <= 3 ? "#f1c40f" : "#27ae60";
  fill.style.width      = pct + "%";
  fill.style.background = color;
}
</script>

</body>
</html>
